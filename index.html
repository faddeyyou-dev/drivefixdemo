          <button class="df-action" type="button" data-prompt="Хочу узнать стоимость услуг"><span class="df-action-ico" aria-hidden="true">💰</span><span>Узнать стоимость</span></button>
          <button class="df-action" type="button" data-prompt="Нужен шиномонтаж"><span class="df-action-ico df-action-ico--wheel" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="7.4" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="2.1" stroke="currentColor" stroke-width="1.5"/><path d="M11.1 9.9 9.8 5.4m3.1 4.5 3.5-3.1m-3.2 5 4.6.8m-6.1.6-2.3 3.9m1.6-5-4.3 1.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M7.1 3.8 5.8 5.1M16.9 3.8l1.3 1.3M20.2 11l1.4-.1M18.6 18.3l1 1M5.4 18.2l-1 1M2.4 10.8 1 10.7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></span><span>Шиномонтаж</span></button>
          <button class="df-action" type="button" data-prompt="Нужен ремонт двигателя"><span class="df-action-ico" aria-hidden="true">🛠️</span><span>Ремонт двигателя</span></button>

          <div class="df-input-row">
            <textarea class="df-input" rows="1" maxlength="4000" placeholder="Опишите проблему с автомобилем..." aria-label="Сообщение для AI-ассистента"></textarea>
            <button class="df-send" type="submit" aria-label="Отправить сообщение" disabled>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 3 10.8 13.2M21 3l-6.5 18-3.7-7.8L3 9.5 21 3Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>

          <p class="df-footnote">Не вводите данные банковских карт и пароли.</p>

  const panel = root.querySelector(".df-panel");
  const launcher = root.querySelector(".df-launcher");
  const closeButton = root.querySelector(".df-close");
  const transcript = root.querySelector(".df-transcript");
  const form = root.querySelector(".df-form");
  const input = root.querySelector(".df-input");
  const sendButton = root.querySelector(".df-send");
  const quickToggle = root.querySelector(".df-quick-toggle");
  const quickActions = root.querySelector(".df-actions");
  const composer = root.querySelector(".df-composer");
  const actionButtons = [...root.querySelectorAll(".df-action")];
  root.querySelector(".df-brand-name").textContent = brand;

  const assistantIcon = `<span class="df-ai-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.5"/><path d="M12 1.8v3M12 19.2v3M1.8 12h3M19.2 12h3M4.8 4.8l2.1 2.1m10.2 10.2 2.1 2.1m0-14.4-2.1 2.1M6.9 17.1l-2.1 2.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>`;
  let sending = false;
  let pendingNode = null;

  function scrollToLatest() { transcript.scrollTop = transcript.scrollHeight; }
  function addMessage(role, text, options = {}) {
    const message = document.createElement("article");
    message.className = `df-message df-message--${role}${options.pending ? " df-pending" : ""}`;
    if (role === "assistant") message.insertAdjacentHTML("beforeend", assistantIcon);
    const bubble = document.createElement("div");
    bubble.className = "df-bubble";
    const tag = document.createElement("span");
    tag.className = "df-message-tag";
    tag.textContent = role === "user" ? "ВЫ" : "AI · АВТОСЕРВИС";
    const copy = document.createElement("p");
    copy.className = "df-message-text";
    copy.textContent = text;
    bubble.append(tag, copy);
    if (options.pending) {
      const dots = document.createElement("span");
      dots.className = "df-typing-dots";
      dots.setAttribute("aria-hidden", "true");
      dots.innerHTML = "<i></i><i></i><i></i>";
      copy.append(dots);
    }
    if (options.retryText) {
      const retry = document.createElement("button");
      retry.className = "df-retry";
      retry.type = "button";
      retry.textContent = "Повторить отправку";
      retry.addEventListener("click", () => {
        message.remove();
        sendMessage(options.retryText, false);
      });
      bubble.append(retry);
    }
    message.append(bubble);
    transcript.append(message);
    scrollToLatest();
    return message;
  }

  function setBusy(value) {
    sending = value;
    input.disabled = value;
    sendButton.disabled = value || !input.value.trim();
    sendButton.setAttribute("aria-busy", String(value));
    actionButtons.forEach((button) => { button.disabled = value; });
  }

  function parseReply(raw, contentType) {
    if ((contentType || "").includes("application/json")) {
      try {
        const data = JSON.parse(raw);
        return String(data.output ?? data.text ?? data.response ?? data.message ?? "").trim();
      } catch (_) { /* fall through to plain text */ }
    }
    const text = String(raw || "").trim();
    if (text.startsWith("{") || text.startsWith("[")) {
      try {
        const data = JSON.parse(text);
        if (typeof data === "string") return data;
        return String(data.output ?? data.text ?? data.response ?? data.message ?? text).trim();
      } catch (_) { /* response is ordinary text */ }
    }
    return text;
  }

  async function sendMessage(rawText, showUserMessage = true) {
    const text = String(rawText || "").trim();
    if (!text || sending) return;
    if (showUserMessage) addMessage("user", text);
    input.value = "";
    input.style.height = "auto";
    setBusy(true);
    pendingNode = addMessage("assistant", "Подбираю ответ", { pending: true });
    const controller = new AbortController();
    const timeout = window.setTimeout(() => controller.abort(), 45000);
    try {
      const response = await fetch(webhook, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
        body: new URLSearchParams({ chatInput: text, userId, chatId }).toString(),
        signal: controller.signal,
      });
      const rawReply = await response.text();
      if (!response.ok) {
        const error = new Error("Webhook request failed");
        error.status = response.status;
        throw error;
      }
      const reply = parseReply(rawReply, response.headers.get("content-type"));
      pendingNode.remove();
      pendingNode = null;
      addMessage("assistant", reply || "Не удалось подготовить ответ. Попробуйте задать вопрос иначе.");
    } catch (error) {
      if (pendingNode) pendingNode.remove();
      pendingNode = null;
      const message = error?.status === 404
        ? "Webhook не найден. Проверьте production URL и публикацию workflow."
        : error?.name === "AbortError"
          ? "Автосервис долго не отвечает. Попробуйте отправить сообщение ещё раз."
          : "Не удалось связаться с автосервисом. Проверьте интернет и попробуйте ещё раз.";
      addMessage("assistant", message, { retryText: text });
    } finally {
      window.clearTimeout(timeout);
      setBusy(false);
      if (!panel.hidden) input.focus({ preventScroll: true });
      scrollToLatest();
    }
  }

  function openChat() {
    panel.hidden = false;
    root.classList.add("df-open");
    launcher.setAttribute("aria-expanded", "true");
    requestAnimationFrame(() => panel.classList.add("df-opening"));
    window.setTimeout(() => input.focus({ preventScroll: true }), 80);
  }
  function closeChat() {
    panel.classList.remove("df-opening");
    panel.hidden = true;
    root.classList.remove("df-open");
    launcher.setAttribute("aria-expanded", "false");
    launcher.focus({ preventScroll: true });
  }

  launcher.addEventListener("click", openChat);
  closeButton.addEventListener("click", closeChat);
  quickToggle.addEventListener("click", () => {
    const expanded = quickToggle.getAttribute("aria-expanded") === "true";
    quickToggle.setAttribute("aria-expanded", String(!expanded));
    quickToggle.querySelector(".df-quick-toggle-label").textContent = expanded ? "Показать" : "Свернуть";
    quickActions.hidden = expanded;
    composer.classList.toggle("df-actions-collapsed", expanded);
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && !panel.hidden && root.contains(document.activeElement)) closeChat();
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = `${Math.min(input.scrollHeight, 112)}px`;
    sendButton.disabled = sending || !input.value.trim();
  });
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing && event.keyCode !== 229) {
      event.preventDefault();
      sendMessage(input.value);
    }
  });
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    sendMessage(input.value);
  });
  actionButtons.forEach((button) => button.addEventListener("click", () => sendMessage(button.dataset.prompt)));

  addMessage("assistant", "Здравствуйте! Я AI-ассистент автосервиса. Опишите проблему с автомобилем или выберите нужное действие — помогу сориентироваться и записаться.");
})();
</script>
